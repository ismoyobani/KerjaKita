
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="Dashboard KerjaKita untuk mengelola profil dan aktivitas pencarian kerja.">
    <title>Dashboard | KerjaKita</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <header class="dashboard-nav">
        <a href="index.html" class="brand">Kerja<span>Kita</span></a>

        <div class="nav-actions">
            <span id="userName">Memuat akun...</span>
            <button id="logoutBtn" class="btn btn-outline" type="button">
                Logout
            </button>
        </div>
    </header>

    <main class="dashboard-container">
        <section class="welcome">
            <p class="eyebrow">DASHBOARD KERJAKITA</p>
            <h1 id="welcomeTitle">Memuat dashboard...</h1>
            <p id="welcomeDescription">
                Sedang mengambil data akun Anda.
            </p>
        </section>

        <div id="dashboardMessage" class="message" role="status" aria-live="polite" hidden></div>

        <section class="profile-card">
            <div class="avatar" id="userInitial" aria-hidden="true">K</div>
            <div>
                <h2 id="profileName">Memuat profil...</h2>
                <p id="profileEmail">-</p>
                <span id="profileRole" class="role-badge">-</span>
            </div>
        </section>

        <section aria-labelledby="menuTitle">
            <h2 class="section-title" id="menuTitle">Menu utama</h2>
            <div id="dashboardMenu" class="dashboard-grid"></div>
        </section>

        <a href="index.html" class="back-link">
            &larr; Kembali ke halaman utama
        </a>
    </main>

    <footer class="dashboard-footer">
        &copy; 2026 KerjaKita. Temukan peluang, bangun masa depan.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
